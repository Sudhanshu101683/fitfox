<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0; padding: 0;
      background: #f5f5f5;
    }
    header {
      background: #222;
      color: #fff;
      padding: 15px;
      text-align: center;
    }
    .cart-container {
      max-width: 800px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }
    th {
      background: #f4f4f4;
    }
    .total {
      text-align: right;
      font-weight: bold;
      font-size: 18px;
      margin-top: 20px;
    }
    .checkout-btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background: #ff6600;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }
    .checkout-btn:hover {
      background: #e65c00;
    }
  </style>
</head>
<body>

  <header>
    <h1>🛒 Your Cart</h1>
  </header>

  <div class="cart-container">
    <table id="cart-table">
      <thead>
        <tr>
          <th>Item</th>
          <th>Price</th>
          <th>Qty</th>
          <th>Subtotal</th>
        </tr>
      </thead>
      <tbody id="cart-body">
        <!-- JS will add items here -->
      </tbody>
    </table>
    <div class="total" id="total-price">Total: ₹0</div>
    <button class="checkout-btn">Proceed to Checkout</button>
  </div>

  <script>
    // Load cart from localStorage
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    function renderCart() {
      const cartBody = document.getElementById("cart-body");
      const totalPriceEl = document.getElementById("total-price");
      cartBody.innerHTML = "";
      let total = 0;

      cart.forEach(item => {
        let subtotal = item.price * item.qty;
        total += subtotal;

        let row = `
          <tr>
            <td>${item.name}</td>
            <td>₹${item.price}</td>
            <td>${item.qty}</td>
            <td>₹${subtotal}</td>
          </tr>
        `;
        cartBody.innerHTML += row;
      });

      totalPriceEl.innerText = "Total: ₹" + total;
    }

    renderCart();
  </script>
</body>
</html>
